name: Daily Evening YouTube Shorts Generator

on:
  schedule:
    # 12:30 UTC corresponds to 6:00 PM IST
    - cron: '30 12 * * *'
  
  workflow_dispatch: # Allows you to manually click "Run workflow" anytime

jobs:
  run-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy edge-tts google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

      - name: Run Shorts Automation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python shorts_generator.py
