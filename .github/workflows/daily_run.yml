name: 5:30 AM Daily Hindi News Generator

on:
  schedule:
    # 00:00 UTC corresponds to 5:30 AM IST daily
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Libraries
        run: |
          pip install google-genai feedparser edge-tts moviepy pillow

      - name: Run News Verification & Video Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save Video File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-news-video
          path: final_news_video.mp4
